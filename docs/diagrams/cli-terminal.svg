<svg viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="W8BDCR Core CLI: thirteen commands">
  <desc>Terminal showing the thirteen core commands and what each does.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="62%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#16a34a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="440" fill="#0b0e14"/>
  <rect width="1200" height="440" fill="url(#dots)"/>
  <rect width="1200" height="440" fill="url(#glow)"/>
  <text x="48" y="52" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#4ade80" letter-spacing="2.5">THE FULL CLI</text>
  <text x="1152" y="52" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#71717a" text-anchor="end" letter-spacing="1.5">13 commands</text>
  <text x="48" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="36" fill="#e9edf3" font-weight="800">Thirteen commands. That's the whole CLI.</text>
  <text x="48" y="162" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core --version</text>
  <text x="278" y="162" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">show version</text>
  <text x="624" y="162" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core brain</text>
  <text x="854" y="162" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">second brain — memories</text>
  <text x="48" y="202" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core env</text>
  <text x="278" y="202" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">manage env vars</text>
  <text x="624" y="202" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core install</text>
  <text x="854" y="202" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">install modules / tools</text>
  <text x="48" y="242" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core show</text>
  <text x="278" y="242" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">tool documentation</text>
  <text x="624" y="242" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core update</text>
  <text x="854" y="242" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">update modules / tools</text>
  <text x="48" y="282" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core uninstall</text>
  <text x="278" y="282" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">remove core or modules</text>
  <text x="624" y="282" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core reinstall</text>
  <text x="854" y="282" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">uninstall + reinstall</text>
  <text x="48" y="322" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core voice</text>
  <text x="278" y="322" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">speech-to-agent</text>
  <text x="624" y="322" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core open</text>
  <text x="854" y="322" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">open docs in browser</text>
  <text x="48" y="362" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core list</text>
  <text x="278" y="362" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">list tools in a module</text>
  <text x="624" y="362" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core pg</text>
  <text x="854" y="362" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">PostgreSQL manager</text>
  <text x="48" y="402" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80" font-weight="700">core init</text>
  <text x="278" y="402" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">configure projects</text>
</svg>
