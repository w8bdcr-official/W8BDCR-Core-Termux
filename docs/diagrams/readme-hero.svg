  <text x="751" y="306" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">26 agents</text>
  <rect x="838" y="272" width="150" height="42" rx="10" fill="#0b0e14" stroke="#22c55e" stroke-opacity="0.35"/>
  <text x="913" y="290" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e9edf3" font-weight="700" text-anchor="middle">dev</text>
  <text x="913" y="306" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">19 tools</text>
  <rect x="1000" y="272" width="150" height="42" rx="10" fill="#0b0e14" stroke="#22c55e" stroke-opacity="0.35"/>
  <text x="1075" y="290" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e9edf3" font-weight="700" text-anchor="middle">npm</text>
  <text x="1075" y="306" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">11 pkgs</text>
  <rect x="676" y="324" width="150" height="42" rx="10" fill="#0b0e14" stroke="#22c55e" stroke-opacity="0.35"/>
  <text x="751" y="342" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e9edf3" font-weight="700" text-anchor="middle">shell</text>
  <text x="751" y="358" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">10 plugins</text>
  <rect x="838" y="324" width="150" height="42" rx="10" fill="#0b0e14" stroke="#22c55e" stroke-opacity="0.35"/>
  <text x="913" y="342" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e9edf3" font-weight="700" text-anchor="middle">lang</text>
  <text x="913" y="358" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">7 langs</text>
  <rect x="1000" y="324" width="150" height="42" rx="10" fill="#0b0e14" stroke="#22c55e" stroke-opacity="0.35"/>
  <text x="1075" y="342" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e9edf3" font-weight="700" text-anchor="middle">db</text>
  <text x="1075" y="358" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">4 DBs</text>
  <rect x="676" y="376" width="150" height="42" rx="10" fill="#0b0e14" stroke="#22c55e" stroke-opacity="0.35"/>
  <text x="751" y="394" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e9edf3" font-weight="700" text-anchor="middle">ui</text>
  <text x="751" y="410" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">4 parts</text>
  <rect x="838" y="376" width="150" height="42" rx="10" fill="#0b0e14" stroke="#22c55e" stroke-opacity="0.35"/>
  <text x="913" y="394" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e9edf3" font-weight="700" text-anchor="middle">editor</text>
  <text x="913" y="410" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">2 parts</text>
  <rect x="1000" y="376" width="150" height="42" rx="10" fill="#0b0e14" stroke="#22c55e" stroke-opacity="0.35"/>
  <text x="1075" y="394" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e9edf3" font-weight="700" text-anchor="middle">auto</text>
  <text x="1075" y="410" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle">n8n</text>
  <rect x="48" y="464" width="260" height="52" rx="12" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="178" y="486" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="17" fill="#e9edf3" font-weight="700" text-anchor="middle">84 tools</text>
  <text x="178" y="506" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e" text-anchor="middle">one core CLI</text>
  <rect x="328" y="464" width="260" height="52" rx="12" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="458" y="486" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="17" fill="#e9edf3" font-weight="700" text-anchor="middle">26 AI agents</text>
  <text x="458" y="506" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e" text-anchor="middle">incl. OpenCode + Hermes</text>
  <rect x="608" y="464" width="260" height="52" rx="12" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="738" y="486" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="17" fill="#e9edf3" font-weight="700" text-anchor="middle">1 command</text>
  <text x="738" y="506" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e" text-anchor="middle">curl | bash to install</text>
  <rect x="888" y="464" width="264" height="52" rx="12" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="1020" y="486" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="17" fill="#e9edf3" font-weight="700" text-anchor="middle">$0 to start</text>
  <text x="1020" y="506" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e" text-anchor="middle">free agents, BYO keys</text>
