<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="W8BDCR Core hero: your phone is now a dev workstation">
  <desc>Fresh W8BDCR Core hero. A terminal on the left running core, the nine modules on the right, proof chips along the bottom.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="62%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#16a34a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="#0b0e14"/>
  <rect width="1200" height="560" fill="url(#dots)"/>
  <rect width="1200" height="560" fill="url(#glow)"/>
  <text x="48" y="58" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#4ade80" letter-spacing="2.5">W8BDCR CORE · TERMUX · ANDROID</text>
  <text x="1152" y="58" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#71717a" text-anchor="end" letter-spacing="1.5">v4.8.2 · MIT</text>
  <text x="48" y="128" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="52" fill="#e9edf3" font-weight="800">Your phone is now a</text>
  <text x="48" y="186" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="52" fill="#4ade80" font-weight="800">dev workstation.</text>
  <rect x="48" y="216" width="560" height="220" rx="18" fill="#111827" stroke="#22c55e" stroke-opacity="0.55"/>
  <rect x="48" y="216" width="560" height="34" rx="18" fill="#161b22"/>
  <rect x="48" y="234" width="560" height="16" fill="#161b22"/>
  <circle cx="72" cy="233" r="4" fill="#22c55e"/>
  <text x="88" y="238" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#c9d1d9">termux — core</text>
  <text x="66" y="282" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80">$ core install ai --opencode</text>
  <text x="66" y="312" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8b949e">✔ OpenCode installed (proot Ubuntu, v1.19.5)</text>
  <text x="66" y="342" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80">$ core install lang db editor</text>
  <text x="66" y="372" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8b949e">✔ 7 languages · 4 databases · Neovim + NvChad</text>
  <text x="66" y="402" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80">$ opencode-start</text>
  <text x="66" y="424" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#71717a"># server up at 127.0.0.1:4096 — TUI attached</text>
  <rect x="648" y="216" width="504" height="220" rx="18" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="676" y="252" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="18" fill="#4ade80" font-weight="700">9 modules · 84 tools · 26 AI agents</text>
  <rect x="676" y="272" width="150" height="42" rx="10" fill="#0b0e14" stroke="#22c55e" stroke-opacity="0.35"/>
