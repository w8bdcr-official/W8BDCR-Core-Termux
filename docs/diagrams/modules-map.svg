  <text x="834" y="320" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e">postgresql · mariadb</text>
  <rect x="48" y="336" width="368" height="72" rx="12" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="66" y="362" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#4ade80" font-weight="700">ui</text>
