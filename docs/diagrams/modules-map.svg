  <text x="450" y="236" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e">gh · fzf · jq · bat</text>
  <rect x="816" y="168" width="368" height="72" rx="12" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="834" y="194" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#4ade80" font-weight="700">npm</text>
