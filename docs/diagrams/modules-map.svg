  <text x="834" y="362" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#4ade80" font-weight="700">auto</text>
  <text x="834" y="386" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#e9edf3">Automation — 1 tool</text>
  <text x="834" y="404" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e">n8n workflows</text>
