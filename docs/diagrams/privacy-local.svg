<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="W8BDCR Core is private and local-first">
  <desc>Everything runs on your phone: code, data, memories, config.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="62%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#16a34a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="#0b0e14"/>
  <rect width="1200" height="360" fill="url(#dots)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <text x="48" y="52" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#4ade80" letter-spacing="2.5">PRIVATE &amp; LOCAL-FIRST</text>
  <text x="1152" y="52" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#71717a" text-anchor="end" letter-spacing="1.5">your phone</text>
  <text x="48" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="36" fill="#e9edf3" font-weight="800">Your code stays on your phone.</text>
  <text x="48" y="144" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="36" fill="#4ade80" font-weight="800">Your keys stay in your shell.</text>
  <rect x="48" y="180" width="552" height="68" rx="12" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="68" y="208" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="16" fill="#e9edf3" font-weight="700">🔒 Code + projects</text>
  <text x="68" y="232" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#8b949e">in Termux, on your phone</text>
  <rect x="624" y="180" width="552" height="68" rx="12" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="644" y="208" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="16" fill="#e9edf3" font-weight="700">🔒 Memories (core brain)</text>
  <text x="644" y="232" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#8b949e">local markdown, optional sync</text>
  <rect x="48" y="264" width="552" height="68" rx="12" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="68" y="292" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="16" fill="#e9edf3" font-weight="700">🔒 API keys</text>
  <text x="68" y="316" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#8b949e">hidden on input, stored in .zshrc</text>
  <rect x="624" y="264" width="552" height="68" rx="12" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="644" y="292" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="16" fill="#e9edf3" font-weight="700">🔒 Models</text>
  <text x="644" y="316" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#8b949e">cloud only if you pick a cloud model</text>
</svg>
