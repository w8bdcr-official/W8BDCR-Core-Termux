<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Server first: OpenCode serve on your phone, TUI attaches">
  <desc>OpenCode runs as a local server on 127.0.0.1:4096; the TUI attaches to it. Same pattern as the Hermes gateway.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="62%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#16a34a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" fill="#0b0e14"/>
  <rect width="1200" height="380" fill="url(#dots)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>
  <text x="48" y="52" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#4ade80" letter-spacing="2.5">SERVER FIRST · LOCAL ONLY</text>
  <text x="1152" y="52" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#71717a" text-anchor="end" letter-spacing="1.5">127.0.0.1:4096</text>
  <text x="48" y="104" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="36" fill="#e9edf3" font-weight="800">The server starts itself.</text>
  <text x="48" y="144" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="36" fill="#4ade80" font-weight="800">You just attach.</text>
  <rect x="48" y="180" width="552" height="150" rx="14" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="72" y="216" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#4ade80" font-weight="700">opencode serve</text>
  <text x="72" y="246" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">Headless server in proot Ubuntu</text>
  <text x="72" y="274" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8b949e">Port 4096 · localhost only</text>
  <text x="72" y="302" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">Starts itself on a bare opencode launch</text>
  <rect x="600" y="180" width="552" height="150" rx="14" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="624" y="216" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#4ade80" font-weight="700">opencode-start</text>
  <text x="624" y="246" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">Server up? Attach the TUI.</text>
  <text x="624" y="274" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#c9d1d9">Server down? Start it, then attach.</text>
  <text x="624" y="302" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8b949e">Stuck? opencode-fix reinstalls + restarts.</text>
  <text x="48" y="360" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="14" fill="#8b949e">Nothing leaves the phone unless the model you chose is a cloud provider.</text>
</svg>
