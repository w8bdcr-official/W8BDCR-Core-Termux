<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="W8BDCR Core session: one command installs the workstation">
  <desc>Terminal session mockup: install, then core, then the module list.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="62%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#16a34a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#0b0e14"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <text x="48" y="52" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#4ade80" letter-spacing="2.5">TERMUX — CORE SESSION</text>
  <text x="1152" y="52" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#71717a" text-anchor="end" letter-spacing="1.5">v4.8.2</text>
  <rect x="48" y="76" width="1104" height="180" rx="14" fill="#111827" stroke="#22c55e" stroke-opacity="0.5"/>
  <text x="72" y="116" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80">$ curl -fsSL https://raw.githubusercontent.com/w8bdcr-official/W8BDCR-Core-Termux/main/install.sh | bash</text>
  <text x="72" y="148" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8b949e">✔ Core installed — 9 modules, 84 tools ready</text>
  <text x="72" y="182" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#4ade80">$ core</text>
  <text x="72" y="214" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e9edf3">W8BDCR-Core-Termux 4.8.2 — lang · db · ai · editor · dev · npm · shell · ui · auto</text>
  <text x="72" y="240" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#71717a"># tip: core install ai --opencode  — OpenCode in proot Ubuntu, server included</text>
</svg>
