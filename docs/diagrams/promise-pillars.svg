<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="W8BDCR Core promise: one command, eighty-four tools, twenty-six agents, free">
  <desc>Four promise pillars: one command, 84 tools, 26 AI agents, runs on your phone.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="62%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#16a34a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="#0b0e14"/>
  <rect width="1200" height="360" fill="url(#dots)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <text x="48" y="52" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#4ade80" letter-spacing="2.5">THE PROMISE</text>
  <text x="1152" y="52" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#71717a" text-anchor="end" letter-spacing="1.5">v4.8.2</text>
  <rect x="48" y="90" width="264" height="190" rx="14" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="68" y="132" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="24" fill="#4ade80" font-weight="800">1 command</text>
  <text x="68" y="168" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="15" fill="#e9edf3" font-weight="700">Installs everything</text>
  <text x="68" y="196" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">curl | bash, then core</text>
  <text x="68" y="246" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="22" fill="#22c55e" font-weight="700">✔</text>
  <rect x="336" y="90" width="264" height="190" rx="14" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="356" y="132" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="24" fill="#4ade80" font-weight="800">84 tools</text>
  <text x="356" y="168" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="15" fill="#e9edf3" font-weight="700">Full dev stack</text>
  <text x="356" y="196" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">langs · DBs · editors</text>
  <text x="356" y="246" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="22" fill="#22c55e" font-weight="700">✔</text>
  <rect x="624" y="90" width="264" height="190" rx="14" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="644" y="132" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="24" fill="#4ade80" font-weight="800">26 AI agents</text>
  <text x="644" y="168" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="15" fill="#e9edf3" font-weight="700">Code with AI</text>
  <text x="644" y="196" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">OpenCode · Hermes · more</text>
  <text x="644" y="246" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="22" fill="#22c55e" font-weight="700">✔</text>
  <rect x="912" y="90" width="264" height="190" rx="14" fill="#111827" stroke="#22c55e" stroke-opacity="0.45"/>
  <text x="932" y="132" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="24" fill="#4ade80" font-weight="800">Your phone</text>
  <text x="932" y="168" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="15" fill="#e9edf3" font-weight="700">No root, no PC</text>
  <text x="932" y="196" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">Termux on Android</text>
  <text x="932" y="246" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="22" fill="#22c55e" font-weight="700">✔</text>
  <text x="48" y="326" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="15" fill="#8b949e">If a tool is in the list, one flag installs it — nothing is unreachable.</text>
</svg>
